name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Бинарник gradle-wrapper.jar не входит в этот бандл (он не текстовый файл).
      # Этот шаг сам создаёт обёртку прямо в CI, если её ещё нет в репозитории.
      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            sudo apt-get update -y && sudo apt-get install -y unzip curl
            curl -sL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.6/bin/gradle wrapper --gradle-version 8.6
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xi-notes-apk
          path: app/build/outputs/apk/debug/app-debug.apk
